[package]
name = "framerush"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Low-latency HDMI capture viewer for Windows"
license = "MIT"
repository = "https://github.com/Hattinga/hattis-projekte"
publish = false

[dependencies]
pollster = "1.0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# DX12 only: the native Windows backend (DXGI flip-model swapchain). Vulkan is
# intentionally not compiled in; see docs/ARCHITECTURE.md ("Backend choice").
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "dx12", "wgsl"] }
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # IMFAttributes::GetItemByIndex (attribute dump), PROPVARIANT (audio
    # endpoint names).
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Audio monitoring (WASAPI).
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_Security",
    # Keep the display awake while capturing; console and error dialog for
    # the release build (no console window).
    "Win32_System_Power",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }
# Already a dependency of `windows`; named directly because the
# `#[implement]` macro (COM callback for the source reader) expands to
# `windows_core::` paths.
windows-core = "0.62.2"

[profile.release]
debug = "line-tables-only"
