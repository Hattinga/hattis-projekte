[package]
name = "clipd-app"
version = "0.1.0"
edition = "2024"
description = "clipd mit Fenster: Bibliothek, Schneiden, Teilen"
license = "MIT"
repository = "https://github.com/Hattinga/hattis-projekte"

[[bin]]
name = "clipd-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipd = { path = ".." }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Deleting a clip moves it to the recycle bin instead of losing it for good.
trash = "5"
