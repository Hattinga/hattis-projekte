name: omnidl CI

on:
  push:
    branches: ['**']
    paths: ['omnidl/**', '.github/workflows/omnidl-ci.yml']
  pull_request:
    paths: ['omnidl/**', '.github/workflows/omnidl-ci.yml']

defaults:
  run:
    working-directory: omnidl

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omnidl
      - name: Tests
        run: cargo test --locked
      # Warnings fail the build, so they cannot pile up again.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (server build)
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --no-default-features --features cli -- -D warnings
      # Downloads yt-dlp, ffmpeg and Deno for this system and starts them;
      # also checks every download link of every platform.
      - name: Tool downloads
        run: cargo test --locked --lib deps::tests -- --ignored
      - name: Build
        run: cargo build --release --locked
      # The server build must not need any window or desktop libraries.
      - name: Headless build
        if: runner.os == 'Linux'
        run: cargo build --release --locked --no-default-features --features cli --bin omnidl-cli
