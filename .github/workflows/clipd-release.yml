name: clipd Release

# A tag like clipd-v0.1.0 (matching clipd/app/tauri.conf.json) builds the
# Windows installer and publishes it as a GitHub release. Manual runs and
# pull requests that touch the packaging build the same installer as a
# workflow artifact and publish nothing.
#
# The repository's "latest" release has to stay an omnidl release — its
# updater, install.sh and badge read /releases/latest — so clipd publishes
# with --latest=false and prefixed tags.

on:
  push:
    tags: ["clipd-v*"]
  pull_request:
    paths:
      - ".github/workflows/clipd-release.yml"
      - "clipd/app/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipd-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: clipd
    shell: bash

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clipd
      - id: version
        name: Version from tauri.conf.json
        run: |
          version=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' app/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "clipd-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Version $version in app/tauri.conf.json"
            exit 1
          fi
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Installer
        working-directory: clipd/app
        # The release config adds the command-line clipd.exe, which only exists
        # after a release build, so debug builds leave it out.
        run: cargo tauri build --config tauri.release.conf.json
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe "dist/clipd-${{ steps.version.outputs.version }}-setup.exe"
          cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: clipd-installer
          path: clipd/dist/*
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are this version's section of CHANGELOG.md (a test makes
        # sure there is one).
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
            echo
            echo "Installer für Windows. ffmpeg lädt clipd beim ersten Start selbst (rund 90 MB)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "clipd $version" \
            --notes-file notes.md \
            --latest=false
